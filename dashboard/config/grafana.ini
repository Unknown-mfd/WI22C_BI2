[server]
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
admin_user = admin
admin_password = admin
allow_embedding = true

[analytics]
check_for_updates = true

[log]
mode = console

[paths]
provisioning = /etc/grafana/provisioning

[branding]
app_title = "ReBoot"
login_logo = ../../logo.png

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
